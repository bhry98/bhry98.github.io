ily="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" >Certificate Database</text><text x="30" y="400" font-size="14" fill="#475569" font-weight="400" text-anchor="start" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" >Confirmation</text><text x="220" y="130" font-size="15" fill="#111827" font-weight="600" text-anchor="start" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" >Specify the setup type of the CA</text><text x="220" y="160" font-size="13" fill="#334155" font-weight="400" text-anchor="start" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" >Enterprise certification authorities (CAs) can use Active Directory Domain Services (AD DS)</text><text x="220" y="178" font-size="13" fill="#334155" font-weight="400" text-anchor="start" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" >to simplify the management of certificates.</text><circle cx="238" cy="215" r="8" fill="#ffffff" stroke="#475569"/><circle cx="238" cy="215" r="4" fill="#2563eb"/><text x="256" y="220" font-size="14" fill="#111827" font-weight="700" text-anchor="start" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" >Enterprise CA</text><text x="256" y="244" font-size="13" fill="#334155" font-weight="400" text-anchor="start" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" >Enterprise CAs must be domain members and are typically online to issue</text><text x="256" y="262" font-size="13" fill="#334155" font-weight="400" text-anchor="start" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" >certificates or certificate policies.</text><rect x="222" y="202" width="150" height="28" fill="none" stroke="#dc2626" stroke-width="2.5" rx="3"/><circle cx="238" cy="305" r="8" fill="#ffffff" stroke="#475569"/><text x="256" y="310" font-size="14" fill="#111827" font-weight="400" text-anchor="start" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" >Standalone CA</text><text x="256" y="334" font-size="13" fill="#334155" font-weight="400" text-anchor="start" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" >Standalone CAs can be members of a workgroup or domain and do not require</text><text x="256" y="352" font-size="13" fill="#334155" font-weight="400" text-anchor="start" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" >AD DS.</text><rect x="458" y="508" width="96" height="30" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/><text x="506" y="528" font-size="13" fill="#111827" font-weight="400" text-anchor="middle" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" >&lt; Previous</text><rect x="566" y="508" width="96" height="30" fill="#f9fafb" stroke="#2563eb" stroke-width="2"/><text x="614" y="528" font-size="13" fill="#111827" font-weight="400" text-anchor="middle" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" >Next &gt;</text><rect x="674" y="508" width="96" height="30" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/><text x="722" y="528" font-size="13" fill="#111827" font-weight="400" text-anchor="middle" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" >Configure</text><rect x="782" y="508" width="96" height="30" fill="#f9fafb" stroke="#9ca3af" stroke-width="1"/><text x="830" y="528" font-size="13" fill="#111827" font-weight="400" text-anchor="middle" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" >Cancel</text>
