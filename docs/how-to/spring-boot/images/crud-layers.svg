<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">Spring Boot CRUD layers</title>
  <desc id="d">An HTTP request goes through the ProductController, then ProductService, then ProductRepository, and reaches the database. The response goes back the same way as JSON.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#04132e"/><stop offset="1" stop-color="#0b1f45"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="6" fill="url(#brand)"/>
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#e2e8f0" text-anchor="middle">
    <g font-size="22" font-weight="700">
      <rect x="40" y="120" width="180" height="120" rx="14" fill="#0a1d40" stroke="#94a3b8" stroke-opacity=".5"/>
      <text x="130" y="175">Client</text>
      <rect x="290" y="120" width="200" height="120" rx="14" fill="#0a1d40" stroke="#38bdf8" stroke-opacity=".6"/>
      <text x="390" y="175">Controller</text>
      <rect x="560" y="120" width="180" height="120" rx="14" fill="#0a1d40" stroke="#38bdf8" stroke-opacity=".6"/>
      <text x="650" y="175">Service</text>
      <rect x="810" y="120" width="190" height="120" rx="14" fill="#0a1d40" stroke="#38bdf8" stroke-opacity=".6"/>
      <text x="905" y="175">Repository</text>
      <rect x="1050" y="120" width="120" height="120" rx="14" fill="#0a1d40" stroke="#2dd4bf" stroke-opacity=".7"/>
      <text x="1110" y="175">DB</text>
    </g>
    <g font-size="15" fill="#94a3b8">
      <text x="130" y="205">curl · Postman</text>
      <text x="390" y="205">HTTP + validation</text>
      <text x="650" y="205">business rules</text>
      <text x="905" y="205">Spring Data JPA</text>
      <text x="1110" y="205">H2 / Postgres</text>
    </g>
    <g stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#a)">
      <path d="M220 160 H282"/><path d="M490 160 H552"/><path d="M740 160 H802"/><path d="M1000 160 H1042"/>
    </g>
    <g stroke="#2dd4bf" stroke-width="2" stroke-dasharray="6 6" fill="none" marker-end="url(#a)">
      <path d="M1110 240 V300 H130 V248"/>
    </g>
    <text x="620" y="330" font-size="17" fill="#cbd5e1">JSON response: 200 OK · 201 Created · 204 No Content · 404 Not Found · 400 Bad Request</text>
    <text x="600" y="72" font-size="26" font-weight="800">Request flow in a Spring Boot CRUD API</text>
  </g>
</svg>
