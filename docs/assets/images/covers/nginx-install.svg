<g><rect x="610" y="110" width="545" height="400" rx="14" fill="#020b1c" stroke="#38bdf8" stroke-opacity=".45"/><rect x="610" y="110" width="545" height="38" rx="14" fill="#0b1f45"/><rect x="610" y="134" width="545" height="14" fill="#0b1f45"/><circle cx="634" cy="129" r="6.5" fill="#f87171"/><circle cx="656" cy="129" r="6.5" fill="#fbbf24"/><circle cx="678" cy="129" r="6.5" fill="#4ade80"/><text x="882.5" y="135" font-size="15" fill="#94a3b8" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace" >root@web01: ~</text><text x="632" y="184" font-size="17" fill="#64748b" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace" ># RHEL / Rocky / Fedora</text><text x="632" y="216" font-size="18" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace"><tspan fill="#2dd4bf">$ </tspan><tspan fill="#e2e8f0">sudo dnf install -y nginx</tspan></text><text x="632" y="248" font-size="18" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace"><tspan fill="#2dd4bf">$ </tspan><tspan fill="#e2e8f0">sudo systemctl enable --now nginx</tspan></text><text x="632" y="280" font-size="18" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace"><tspan fill="#2dd4bf">$ </tspan><tspan fill="#e2e8f0">sudo firewall-cmd --add-service=http</tspan></text><text x="632" y="312" font-size="18" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace"><tspan fill="#2dd4bf">$ </tspan><tspan fill="#e2e8f0">curl -I http://localhost</tspan></text><text x="632" y="344" font-size="17" fill="#4ade80" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace" >HTTP/1.1 200 OK</text><text x="632" y="376" font-size="17" fill="#94a3b8" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace" >Server: nginx/1.28.0</text><text x="632" y="408" font-size="18" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace"><tspan fill="#2dd4bf">$ </tspan><tspan fill="#e2e8f0">nginx -t</tspan></text><text x="632" y="440" font-size="17" fill="#4ade80" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', 'DejaVu Sans Mono', Consolas, Menlo, monospace" >syntax is ok · test is successful</text></g></svg>