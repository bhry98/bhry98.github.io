<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Laravel API Response</title>
  <desc id="desc">A fluent, consistent JSON response builder for Laravel 11, 12, 13 and 14: api()->created($user) returns a standard status, message and data envelope.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04132e"/>
      <stop offset="1" stop-color="#0b1f45"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#brand)"/>

  <!-- Left: identity -->
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="150" fill="#38bdf8" font-size="22" font-weight="600" letter-spacing="3">BHRY98 / LARAVEL PACKAGE</text>
    <text x="80" y="232" fill="#ffffff" font-size="68" font-weight="800">Laravel</text>
    <text x="80" y="312" fill="url(#brand)" font-size="68" font-weight="800">API Response</text>
    <text x="80" y="372" fill="#cbd5e1" font-size="24">One fluent builder for every JSON</text>
    <text x="80" y="406" fill="#cbd5e1" font-size="24">response your API sends.</text>

    <!-- version pills -->
    <g font-size="18" font-weight="700">
      <rect x="80" y="456" width="112" height="40" rx="20" fill="#0a1d40" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="136" y="482" fill="#e2e8f0" text-anchor="middle">Laravel 11</text>
      <rect x="204" y="456" width="62" height="40" rx="20" fill="#0a1d40" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="235" y="482" fill="#e2e8f0" text-anchor="middle">12</text>
      <rect x="278" y="456" width="62" height="40" rx="20" fill="#0a1d40" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="309" y="482" fill="#e2e8f0" text-anchor="middle">13</text>
      <rect x="352" y="456" width="62" height="40" rx="20" fill="#0a1d40" stroke="#38bdf8" stroke-opacity="0.5"/>
      <text x="383" y="482" fill="#e2e8f0" text-anchor="middle">14</text>
      <rect x="426" y="456" width="118" height="40" rx="20" fill="#0a1d40" stroke="#2dd4bf" stroke-opacity="0.5"/>
      <text x="485" y="482" fill="#e2e8f0" text-anchor="middle">PHP 8.2+</text>
    </g>

    <text x="80" y="566" fill="#64748b" font-size="20" font-family="'JetBrains Mono', Menlo, Consolas, monospace">composer require bhry98/laravel-api-response</text>
  </g>

  <!-- Right: code card -->
  <g font-family="'JetBrains Mono', Menlo, Consolas, 'Courier New', monospace" font-size="19">
    <rect x="680" y="96" width="528" height="448" rx="18" fill="#020b1c" stroke="#94a3b8" stroke-opacity="0.18"/>
    <circle cx="712" cy="128" r="7" fill="#f87171"/>
    <circle cx="736" cy="128" r="7" fill="#fbbf24"/>
    <circle cx="760" cy="128" r="7" fill="#34d399"/>
    <text x="1180" y="134" fill="#64748b" font-size="15" text-anchor="end">UserController.php</text>

    <text x="712" y="190"><tspan fill="#c084fc">return</tspan><tspan fill="#38bdf8"> api</tspan><tspan fill="#e2e8f0">()</tspan></text>
    <text x="736" y="222"><tspan fill="#e2e8f0">-&gt;</tspan><tspan fill="#60a5fa">created</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#fca5a5">$user</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#86efac">'User created.'</tspan><tspan fill="#e2e8f0">)</tspan></text>
    <text x="736" y="254"><tspan fill="#e2e8f0">-&gt;</tspan><tspan fill="#60a5fa">meta</tspan><tspan fill="#e2e8f0">([</tspan><tspan fill="#86efac">'v'</tspan><tspan fill="#e2e8f0"> =&gt; </tspan><tspan fill="#86efac">'1'</tspan><tspan fill="#e2e8f0">]);</tspan></text>

    <line x1="712" y1="288" x2="1176" y2="288" stroke="#94a3b8" stroke-opacity="0.15"/>
    <text x="712" y="320" fill="#64748b" font-size="15">HTTP/1.1 201 Created</text>

    <text x="712" y="356" fill="#e2e8f0">{</text>
    <text x="736" y="388"><tspan fill="#7dd3fc">"status"</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#2dd4bf">true</tspan><tspan fill="#e2e8f0">,</tspan></text>
    <text x="736" y="420"><tspan fill="#7dd3fc">"message"</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">"User created."</tspan><tspan fill="#e2e8f0">,</tspan></text>
    <text x="736" y="452"><tspan fill="#7dd3fc">"data"</tspan><tspan fill="#e2e8f0">: { </tspan><tspan fill="#7dd3fc">"id"</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#fbbf24">1</tspan><tspan fill="#e2e8f0"> },</tspan></text>
    <text x="736" y="484"><tspan fill="#7dd3fc">"meta"</tspan><tspan fill="#e2e8f0">: { </tspan><tspan fill="#7dd3fc">"v"</tspan><tspan fill="#e2e8f0">: </tspan><tspan fill="#86efac">"1"</tspan><tspan fill="#e2e8f0"> }</tspan></text>
    <text x="712" y="516" fill="#e2e8f0">}</text>
  </g>
</svg>
