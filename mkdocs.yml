site_name: Abdelrahman Mahmoud
site_url: https://bhry98.github.io/
site_author: Abdelrahman Mahmoud
site_description: >-
  Abdelrahman Mahmoud, Enterprise Software & Integration Engineer.
  Java Spring Boot, IBM App Connect Enterprise integrations, Red Hat OpenShift and identity & access management.
copyright: >-
  &copy; 2026 Abdelrahman Mahmoud · bhry98

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/avatar.jpg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - announce.dismiss
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

# Files in docs/ that are not published (the How-To template is only for copying).
exclude_docs: |
  how-to/_template.md

extra_css:
  - stylesheets/extra.css
  - stylesheets/cv.css

extra_javascript:
  - javascripts/share.js

plugins:
  - search
  - blog:
      blog_dir: blog
      blog_toc: true
      post_date_format: long
      post_url_format: "{slug}"
      post_readtime: true
      pagination_per_page: 6
      archive: false
      categories_allowed:
        - Spring Boot
        - Integration
        - OpenShift
        - Security
        - Architecture
        - Infrastructure
        - DevOps
        - Java
        - Fundamentals
  - tags
  # Click-to-zoom for screenshots in How-To guides. Add { .off-glb } to an image to opt out.
  - glightbox:
      skip_classes:
        - off-glb
  # Generates a preview image (Open Graph / Twitter card) for every page,
  # so links shared on WhatsApp, LinkedIn, X, Facebook, Telegram show an image.
  - social:
      cards_layout: bhry98   # layouts/bhry98.yml: uses the page `cover:` SVG when set
      cards_layout_options:
        background_color: "#0a2a5e"
        color: "#ffffff"
  # Old URLs keep working (and keep their search ranking) after a page moves.
  - redirects:
      redirect_maps:
        blog/spring-boot-keycloak.md: how-to/spring-boot/secure-api-with-keycloak.md
        blog/openshift-debugging-pods.md: how-to/openshift/debug-pods.md

extra:
  generator: false
  # Paste the code from Google Search Console (HTML tag method) to verify the site:
  # google_site_verification: xxxxxxxxxxxxxxxxxxxxxxxx
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bhry98
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/bhry98/
      name: LinkedIn
    - icon: material/rss
      link: https://bhry98.github.io/blog/
      name: Blog

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      extend_pygments_lang:
        - name: php
          lang: php
          options:
            startinline: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Portfolio:
      - portfolio/index.md
      - About Me: portfolio/about-me.md
      - Skills: portfolio/skills.md
      - Projects: portfolio/projects.md
      - Open Source: portfolio/packages.md
      - Contact: portfolio/contact.md
  - My CV: cv/index.md
  - How-To:
      - how-to/index.md
      - Nginx:
          - Install Nginx: how-to/nginx/install-nginx.md
          - Reverse Proxy, Load Balancing & HA: how-to/nginx/nginx-reverse-proxy-load-balancing-ha.md
      - Git:
          - Install Git: how-to/git/install-git.md
      - Active Directory:
          - Enable LDAPS on Active Directory: how-to/active-directory/enable-ldaps-active-directory.md
      - Keycloak:
          - Install Keycloak: how-to/keycloak/install-keycloak.md
      - Spring Boot:
          - Simple CRUD API: how-to/spring-boot/simple-crud.md
          - Secure an API with Keycloak: how-to/spring-boot/secure-api-with-keycloak.md
      - OpenShift:
          - Debug Pods: how-to/openshift/debug-pods.md
  - Blog:
      - blog/index.md
  - Packages:
      - packages/index.md
      - Laravel API Response:
          - Introduction: packages/laravel-api-response/index.md
          - Installation: packages/laravel-api-response/installation.md
          - Responses: packages/laravel-api-response/responses.md
          - Customization: packages/laravel-api-response/customization.md
          - Upgrade Guide: packages/laravel-api-response/upgrade.md
      - Keycloak Laravel Auth:
          - Introduction: packages/keycloak-laravel-auth/index.md
          - Installation: packages/keycloak-laravel-auth/installation.md
          - Configuration: packages/keycloak-laravel-auth/configuration.md
          - Web SSO: packages/keycloak-laravel-auth/web-sso.md
          - API Authentication: packages/keycloak-laravel-auth/api-authentication.md
          - Authorization: packages/keycloak-laravel-auth/authorization.md
          - OIDC & Service Tokens: packages/keycloak-laravel-auth/oidc.md
          - Admin API: packages/keycloak-laravel-auth/admin-api.md
          - Testing & Tooling: packages/keycloak-laravel-auth/testing.md
          - Upgrade Guide: packages/keycloak-laravel-auth/upgrade.md
