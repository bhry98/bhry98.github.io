site_name: BHRY98
site_url: https://bhry98.github.io/
site_author: Abdelrahman Mahmoud (bhry98)
site_description: >-
  Abdelrahman (bhry98), Enterprise Software & Integration Engineer.
  Java Spring Boot, IBM App Connect Enterprise integrations, Red Hat OpenShift and identity & access management.
copyright: >-
  &copy; 2026 Abdelrahman Mahmoud · bhry98

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/avatar.jpg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - announce.dismiss
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css
  - stylesheets/cv.css

extra_javascript:
  - javascripts/share.js

plugins:
  - search
  - blog:
      blog_dir: blog
      blog_toc: true
      post_date_format: long
      post_url_format: "{slug}"
      post_readtime: true
      pagination_per_page: 6
      archive_date_format: yyyy
      categories_allowed:
        - Spring Boot
        - Integration
        - OpenShift
        - Security
        - Architecture
  - tags
  # Generates a preview image (Open Graph / Twitter card) for every page,
  # so links shared on WhatsApp, LinkedIn, X, Facebook, Telegram show an image.
  - social:
      cards_layout_options:
        background_color: "#0a2a5e"
        color: "#ffffff"

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bhry98
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/bhry98/
      name: LinkedIn
    - icon: material/rss
      link: https://bhry98.github.io/blog/
      name: Blog

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      extend_pygments_lang:
        - name: php
          lang: php
          options:
            startinline: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Portfolio:
      - portfolio/index.md
      - About Me: portfolio/about-me.md
      - Services: portfolio/services.md
      - Skills: portfolio/skills.md
      - Projects: portfolio/projects.md
      - Open Source: portfolio/packages.md
      - Contact: portfolio/contact.md
  - My CV: cv/index.md
  - Blog:
      - blog/index.md
  - Packages:
      - packages/index.md
      - Laravel API Response:
          - Introduction: packages/laravel-api-response/index.md
          - Installation: packages/laravel-api-response/installation.md
          - Responses: packages/laravel-api-response/responses.md
          - Customization: packages/laravel-api-response/customization.md
          - Upgrade Guide: packages/laravel-api-response/upgrade.md
